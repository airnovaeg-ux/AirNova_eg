<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
body { background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 50%, #bae6fd 100%); color: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px 15px; }
.card { width: 100%; max-width: 430px; background: #ffffff; border: 2px solid #bae6fd; border-radius: 24px; padding: 32px 18px; text-align: center; box-shadow: 0 15px 35px rgba(2, 132, 199, 0.15); border-top: 7px solid #0284c7; }
.logo-box { width: 105px; height: 105px; border-radius: 22px; margin: 0 auto 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f0f9ff; border: 2px solid #7dd3fc; box-shadow: 0 6px 16px rgba(2, 132, 199, 0.15); }
.logo-box img { width: 100%; height: 100%; object-fit: cover; }
h1 { font-size: 27px; font-weight: 800; color: #0369a1; margin-bottom: 6px; }
.sub { font-size: 13px; color: #0c4a6e; background: #f0f9ff; padding: 8px 12px; border-radius: 10px; border: 1px solid #bae6fd; margin-bottom: 24px; font-weight: 700; line-height: 1.6; display: inline-block; }
.links { display: flex; flex-direction: column; gap: 12px; }
.btn { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-radius: 15px; text-decoration: none; background: #f8fafc; border: 1.5px solid #e0f2fe; transition: 0.2s; }
.btn:hover, .btn:active { background: #e0f2fe; border-color: #38bdf8; transform: translateY(-2px); }
.right { display: flex; align-items: center; gap: 13px; }
.ico { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 21px; color: #fff; flex-shrink: 0; }
.txt { text-align: right; }
.title { display: block; font-size: 15px; font-weight: 800; color: #0c4a6e; }
.desc { display: block; font-size: 12px; color: #475569; font-weight: 600; direction: ltr; text-align: right; }
.fb { background: #1877F2; }
.wa { background: #25D366; }
.ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.tt { background: #0f172a; }
.gm { background: #EA4335; }
.ph { background: #0284c7; }
.arr { color: #0284c7; font-size: 14px; }
footer { margin-top: 25px; font-size: 12px; color: #64748b; font-weight: 700; }
</style>
</head>
