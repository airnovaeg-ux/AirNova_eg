<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirNova | تواصل معنا</title>
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- أيقونات وشعارات المنصات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.5);
        }

        .brand-icon {
            width: 74px;
            height: 74px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 34px;
            color: #ffffff;
            box-shadow: 0 8px 22px rgba(56, 189, 248, 0.35);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        .subtitle {
            font-size: 13.5px;
            color: #94a3b8;
            margin-bottom: 28px;
            font-weight: 600;
            line-height: 1.6;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            transition: all 0.25s ease;
        }

        .link-btn:hover, .link-btn:active {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
        }

        .btn-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-text {
            text-align: right;
        }

        .btn-title {
            display: block;
            font-size: 15.5px;
            font-weight: 700;
            color: #f8fafc;
        }

        .btn-desc {
            display: block;
            font-size: 12.5px;
            color: #cbd5e1;
            font-weight: 400;
            direction: ltr;
            text-align: right;
            margin-top: 2px;
        }

        /* ألوان شعارات المنصات الرسمية */
        .fb .icon-box { background: #1877F2; color: #ffffff; }
        .wa .icon-box { background: #25D366; color: #ffffff; }
        .ig .icon-box { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #ffffff; }
        .tt .icon-box { background: #000000; color: #ffffff; border: 1px solid #334155; }
        .gm .icon-box { background: #EA4335; color: #ffffff; }
        .ph .icon-box { background: #0284c7; color: #ffffff; }

        .arrow-icon {
            color: #64748b;
            font-size: 14px;
            transition: transform 0.25s ease;
        }

        .link-btn:hover .arrow-icon {
            transform: translateX(-4px);
            color: #38bdf8;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شعار AirNova الرمزي -->

            <i class="fa-solid fa-wind"></i>
        </div>
        <h1>AIR NOVA</h1>
        <p class="subtitle">حلول الهواء باحترافية<br>تهوية • شفط • مجاري هواء • أنظمة تكييف</p>

        <!-- قائمة الروابط المباشرة -->
        <div class="links-list">

                <div class="btn-right">
                    <div class="icon-box"><i class="fa-brands fa-facebook-f"></i></div>
                    <div class="btn-text">
                        <span class="btn-title">AirNova Facebook</span>
                        <span class="btn-desc">صفحتنا الرسمية على فيسبوك</span>

                </div>

            <a href="https://wa.me/201102200520" target="_blank" rel="noopener noreferrer" class="link-btn wa">

                    <div class="btn-text">
                        <span class="btn-title">تواصل عبر واتساب</span>
                        <span class="btn-desc">01102200520</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- إنستجرام -->
            <a href="https://www.instagram.com/air_nova_eg?exln=MTdyeHhtMWdxNmkzeg==" target="_blank" rel="noopener noreferrer" class="link-btn ig">
                <div class="btn-right">
                    <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                    <div class="btn-text">
                        <span class="btn-title">Instagram</span>
                        <span class="btn-desc">@air_nova_eg</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- تيك توك -->
            <a href="https://www.tiktok.com/@airnovaeg?_r=1&_t=ZS-9AkX80MRAaj" target="_blank" rel="noopener noreferrer" class="link-btn tt">
                <div class="btn-right">
                    <div class="icon-box"><i class="fa-brands fa-tiktok"></i></div>
                    <div class="btn-text">
                        <span class="btn-title">TikTok</span>

            <!-- جيميل -->
            <a href="mailto:Airnovaeg@gmail.com" class="link-btn gm">
                <div class="btn-right">

                    <div class="btn-text">
                        <span class="btn-title">البريد الإلكتروني (Gmail)</span>
                        <span class="btn-desc">Airnovaeg@gmail.com</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- رقم التواصل والاتصال المباشر -->
            <a href="tel:01102200520" class="link-btn ph">
                <div class="btn-right">
                    <div class="icon-box"><i class="fa-solid fa-phone-volume"></i></div>
                    <div class="btn-text">
                        <span class="btn-title">اتصال مباشر</span>

                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

        </div>

        <footer>
            © 2026 AirNova - جميع الحقوق محفوظة
        </footer>
    </div>

</body>
</html>
