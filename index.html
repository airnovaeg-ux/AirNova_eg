<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirNova | تواصل معنا</title>
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- أيقونات وشعارات المنصات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* خلفية متدرجة بين الأبيض والأزرق الثلجي الفاتح */
            background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 50%, #bae6fd 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #bae6fd;
            border-radius: 26px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(2, 132, 199, 0.12);
            position: relative;
            overflow: hidden;
        }

        /* شريط علوي أزرق أنيق */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 7px;
            background: linear-gradient(90deg, #0284c7, #38bdf8, #0369a1);
        }

        /* تنسيق لوجو الشركة */
        .brand-logo {
            width: 108px;
            height: 108px;
            border-radius: 24px;
            margin: 5px auto 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 3px solid #e0f2fe;
            box-shadow: 0 8px 22px rgba(2, 132, 199, 0.18);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            color: #0369a1; /* أزرق احترافي صريح */
        }

        .subtitle {
            font-size: 13.5px;
            color: #475569;
            margin-bottom: 26px;
            font-weight: 700;
            line-height: 1.7;
            background: #f0f9ff;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid #e0f2fe;
            display: inline-block;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: #0f172a;
            background: #f8fafc;
            border: 1.5px solid #e0f2fe;
            transition: all 0.25s ease;
        }

        .link-btn:hover, .link-btn:active {
            transform: translateY(-3px);
            background: #f0f9ff;
            border-color: #38bdf8;
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.14);
        }

        .btn-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.12);
        }

        .btn-text {
            text-align: right;
        }

        .btn-title {
            display: block;
            font-size: 15.5px;
            font-weight: 800;
            color: #0c4a6e; /* كحلي/أزرق غامق واضح جداً على الأبيض */
        }

        .btn-desc {
            display: block;
            font-size: 12.5px;
            color: #64748b;
            font-weight: 600;
            direction: ltr;
            text-align: right;
            margin-top: 2px;
        }

        /* ألوان شعارات المنصات الرسمية */
        .fb .icon-box { background: #1877F2; color: #ffffff; }
        .wa .icon-box { background: #25D366; color: #ffffff; }
        .ig .icon-box { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #ffffff; }
        .tt .icon-box { background: #0f172a; color: #ffffff; }
        .gm .icon-box { background: #EA4335; color: #ffffff; }
        .ph .icon-box { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #ffffff; }

        .arrow-icon {
            color: #0284c7;
            font-size: 14px;
            transition: transform 0.25s ease;
        }

        .link-btn:hover .arrow-icon {
            transform: translateX(-4px);
            color: #0369a1;
        }

        footer {
            margin-top: 28px;
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوجو شركة AirNova -->
        <div class="brand-logo">

        <div class="links-list">

                <div class="btn-right">

                        <span class="btn-title">تواصل عبر واتساب</span>

            <!-- إنستجرام -->
            <a href="https://www.instagram.com/air_nova_eg?exln=MTdyeHhtMWdxNmkzeg==" target="_blank" rel="noopener noreferrer" class="link-btn ig">
                <div class="btn-right">
                    <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                    <div class="btn-text">
                        <span class="btn-title">Instagram</span>

                <div class="btn-right">
                    <div class="icon-box"><i class="fa-brands fa-tiktok"></i></div>

                        <span class="btn-title">TikTok</span>

                <i class="fa-solid fa-chevron-left arrow-icon"></i>

            <!-- جيميل -->
            <a href="mailto:Airnovaeg@gmail.com" class="link-btn gm">
                <div class="btn-right">

                    <div class="btn-text">

                        <span class="btn-desc">Airnovaeg@gmail.com</span>
                    </div>
                </div>

            </a>

            <!-- رقم التواصل والاتصال المباشر -->
            <a href="tel:01102200520" class="link-btn ph">
                <div class="btn-right">
                    <div class="icon-box"><i class="fa-solid fa-phone-volume"></i></div>
                    <div class="btn-text">
                        <span class="btn-title">اتصال مباشر</span>
                        <span class="btn-desc">01102200520</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

        </div>

        <footer>
            © 2026 AirNova - جميع الحقوق محفوظة
        </footer>
    </div>

</body>
</html>
